# A private API proxy; Caddy is the only published application entry point.
# Use the frontend's pinned unprivileged Nginx image with one worker for 64 MiB.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    # No request headers (including the origin token) are written to access logs.
    access_log off;
    server_tokens off;
    default_type application/json;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # CloudFront generates the address, and Caddy overwrites this internal header
    # after verifying the origin token. Never key limits on viewer-supplied XFF.
    # Omit the source port so reconnecting cannot evade a viewer's limits.
    # Missing/malformed metadata shares Caddy's key rather than bypassing limits.
    map $http_x_routewise_viewer_address $routewise_client {
        default $remote_addr;
        ~^\[(?<viewer_ipv6>[0-9A-Fa-f:.]+)\]:[0-9]+$ $viewer_ipv6;
        ~^(?<viewer_ipv4>[0-9.]+):[0-9]+$ $viewer_ipv4;
        ~^(?<viewer_ipv6_unbracketed>[0-9A-Fa-f:]+):[0-9]+$ $viewer_ipv6_unbracketed;
    }

    limit_req_zone $routewise_client zone=routewise_api:10m rate=15r/s;
    limit_conn_zone $routewise_client zone=routewise_connections:10m;

    # Resolve at request time so replacing the backend container cannot leave a
    # stale IP, and offline nginx -t needs no running application or public DNS.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name _;
        charset utf-8;
        client_max_body_size 32k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        keepalive_timeout 15s;
        limit_conn routewise_connections 20;
        limit_conn_status 429;
        limit_req_status 429;
        add_header Cache-Control "no-store" always;

        set $routewise_upstream http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $routewise_client;
        proxy_set_header X-Forwarded-For $routewise_client;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_set_header X-RouteWise-Origin-Token "";
        proxy_set_header X-RouteWise-Viewer-Address "";
        proxy_set_header CloudFront-Viewer-Address "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;

        location = /healthz {
            default_type text/plain;
            return 200 "healthy\n";
        }

        location ~ ^/health(/|$) {
            proxy_pass $routewise_upstream;
        }

        location ~ ^/api(/|$) {
            limit_req zone=routewise_api burst=30 nodelay;
            proxy_pass $routewise_upstream;
        }

        location / {
            return 404 '{"detail":"Not found"}';
        }
    }
}
