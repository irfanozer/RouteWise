name: Publish images and deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routewise-production
  cancel-in-progress: false

jobs:
  images:
    name: Publish immutable images
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      deploy_sha: ${{ steps.release.outputs.deploy_sha }}
      backend_image: ${{ steps.immutable.outputs.backend_image }}
      frontend_image: ${{ steps.immutable.outputs.frontend_image }}
    steps:
      - name: Resolve the tested release
        id: release
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          deploy_sha="${WORKFLOW_RUN_SHA:-${GITHUB_SHA}}"
          [[ "$deploy_sha" =~ ^[0-9a-f]{40}$ ]]
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "backend_tag=ghcr.io/${repository}-backend:${deploy_sha}" >> "$GITHUB_OUTPUT"
          echo "frontend_tag=ghcr.io/${repository}-frontend:${deploy_sha}" >> "$GITHUB_OUTPUT"

      - name: Check out the tested commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ steps.release.outputs.deploy_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish backend
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.backend_tag }}
          labels: |
            org.opencontainers.image.title=RouteWise API
            org.opencontainers.image.description=Disruption-aware transit routing API
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.deploy_sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=routewise-backend
          cache-to: type=gha,mode=max,scope=routewise-backend
          provenance: mode=max
          sbom: true

      - name: Build and publish frontend
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.release.outputs.frontend_tag }}
          labels: |
            org.opencontainers.image.title=RouteWise Web
            org.opencontainers.image.description=Interactive RouteWise transit disruption demo
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.deploy_sha }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha,scope=routewise-frontend
          cache-to: type=gha,mode=max,scope=routewise-frontend
          provenance: mode=max
          sbom: true

      - name: Record immutable image digests
        id: immutable
        env:
          BACKEND_TAG: ${{ steps.release.outputs.backend_tag }}
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_TAG: ${{ steps.release.outputs.frontend_tag }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BACKEND_DIGEST"
          test -n "$FRONTEND_DIGEST"
          echo "backend_image=${BACKEND_TAG%:*}@${BACKEND_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${FRONTEND_TAG%:*}@${FRONTEND_DIGEST}" >> "$GITHUB_OUTPUT"
          {
            echo "### RouteWise container images"
            echo ""
            echo "Published immutable images for commit \`${{ steps.release.outputs.deploy_sha }}\`."
            echo ""
            echo "Azure deployment enabled: \`${{ vars.AZURE_DEPLOYMENT_ENABLED || 'false' }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Migrate, deploy, and verify
    needs: images
    if: vars.AZURE_DEPLOYMENT_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX || 'routewise' }}
      ENVIRONMENT_NAME: ${{ vars.AZURE_ENVIRONMENT_NAME || 'prod' }}
      CONTAINER_APPS_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APPS_ENVIRONMENT || 'cae-routewise-prod' }}
      CUSTOM_DOMAIN: ${{ vars.ROUTEWISE_CUSTOM_DOMAIN || 'routewise.irfanburakozer.com' }}
      REQUIRE_CUSTOM_DOMAIN: ${{ vars.ROUTEWISE_REQUIRE_CUSTOM_DOMAIN || 'false' }}
      DATABASE_URL: ${{ secrets.ROUTEWISE_DATABASE_URL }}
      BACKEND_IMAGE: ${{ needs.images.outputs.backend_image }}
      FRONTEND_IMAGE: ${{ needs.images.outputs.frontend_image }}
    steps:
      - name: Check out the tested commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.images.outputs.deploy_sha }}

      - name: Validate production settings
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in RESOURCE_GROUP CONTAINER_APPS_ENVIRONMENT DATABASE_URL AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required production setting $name is missing." >&2
              exit 1
            fi
          done
          [[ "$DATABASE_URL" == *"ssl=require"* ]]

      - name: Verify images allow anonymous pulls
        shell: bash
        run: |
          set -euo pipefail
          for image in "$BACKEND_IMAGE" "$FRONTEND_IMAGE"; do
            if ! docker manifest inspect "$image" > /dev/null; then
              echo "Cannot pull $image anonymously. Make both RouteWise packages public in GitHub before deployment." >&2
              exit 1
            fi
          done

      - name: Sign in to Azure with GitHub OIDC
        uses: azure/login@4c03e4685fe81df2c50d5714c7d93cf39d8deb7f # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate templates
        shell: bash
        run: |
          set -euo pipefail
          for template in infra/azure/*.bicep; do
            az bicep build --file "$template" --stdout > /dev/null
          done

      - name: Preserve existing custom-domain certificate
        id: custom_domain
        shell: bash
        run: |
          set -euo pipefail
          web_app="${NAME_PREFIX}-web-${ENVIRONMENT_NAME}"
          existing="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$web_app" --query name --output tsv --only-show-errors 2>/dev/null || true)"
          certificate_id=""
          if [[ -n "$existing" ]]; then
            certificate_id="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$web_app" --query "properties.configuration.ingress.customDomains[?name=='${CUSTOM_DOMAIN}'].certificateId | [0]" --output tsv --only-show-errors 2>/dev/null || true)"
          fi
          if [[ -z "$certificate_id" ]]; then
            certificate_id="$(az containerapp env certificate list --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APPS_ENVIRONMENT" --managed-certificates-only --query "[?properties.subjectName=='${CUSTOM_DOMAIN}'].id | [0]" --output tsv --only-show-errors 2>/dev/null || true)"
          fi
          if [[ -z "$certificate_id" ]]; then
            if [[ "$REQUIRE_CUSTOM_DOMAIN" == "true" ]]; then
              echo "Required managed certificate for $CUSTOM_DOMAIN was not found." >&2
              exit 1
            fi
            echo "domain_name=" >> "$GITHUB_OUTPUT"
            echo "certificate_id=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "domain_name=$CUSTOM_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "certificate_id=$certificate_id" >> "$GITHUB_OUTPUT"

      - name: Create migration job
        id: migration
        shell: bash
        run: |
          set -euo pipefail
          job_name="$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "migration-${GITHUB_RUN_ID}" \
            --template-file infra/azure/migration.bicep \
            --parameters \
              namePrefix="$NAME_PREFIX" \
              environmentName="$ENVIRONMENT_NAME" \
              containerAppsEnvironmentName="$CONTAINER_APPS_ENVIRONMENT" \
              backendImage="$BACKEND_IMAGE" \
              databaseUrl="$DATABASE_URL" \
            --query properties.outputs.migrationJobName.value \
            --output tsv \
            --only-show-errors)"
          test -n "$job_name"
          echo "job_name=$job_name" >> "$GITHUB_OUTPUT"

      - name: Apply migrations
        env:
          MIGRATION_JOB: ${{ steps.migration.outputs.job_name }}
        shell: bash
        run: |
          set -euo pipefail
          execution="$(az containerapp job start --resource-group "$RESOURCE_GROUP" --name "$MIGRATION_JOB" --query name --output tsv --only-show-errors)"
          test -n "$execution"
          for _ in {1..60}; do
            status="$(az containerapp job execution show --resource-group "$RESOURCE_GROUP" --name "$MIGRATION_JOB" --job-execution-name "$execution" --query properties.status --output tsv --only-show-errors)"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Canceled) echo "Migration ended with $status." >&2; exit 1 ;;
            esac
            sleep 10
          done
          echo "Migration did not finish within ten minutes." >&2
          exit 1

      - name: Record currently deployed images
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          previous_frontend="$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "${NAME_PREFIX}-web-${ENVIRONMENT_NAME}" \
            --query 'properties.template.containers[0].image' \
            --output tsv \
            --only-show-errors 2>/dev/null || true)"
          previous_backend="$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "${NAME_PREFIX}-api-${ENVIRONMENT_NAME}" \
            --query 'properties.template.containers[0].image' \
            --output tsv \
            --only-show-errors 2>/dev/null || true)"
          echo "frontend_image=$previous_frontend" >> "$GITHUB_OUTPUT"
          echo "backend_image=$previous_backend" >> "$GITHUB_OUTPUT"

      - name: Deploy application revision
        id: release
        shell: bash
        run: |
          set -euo pipefail
          outputs="$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "apps-${GITHUB_RUN_ID}" \
            --template-file infra/azure/apps.bicep \
            --parameters \
              namePrefix="$NAME_PREFIX" \
              environmentName="$ENVIRONMENT_NAME" \
              containerAppsEnvironmentName="$CONTAINER_APPS_ENVIRONMENT" \
              frontendImage="$FRONTEND_IMAGE" \
              backendImage="$BACKEND_IMAGE" \
              databaseUrl="$DATABASE_URL" \
              browserCustomDomainName="$CUSTOM_DOMAIN" \
              webCustomDomainName="${{ steps.custom_domain.outputs.domain_name }}" \
              webCustomDomainCertificateId="${{ steps.custom_domain.outputs.certificate_id }}" \
              webMinReplicas=1 webMaxReplicas=1 \
              apiMinReplicas=1 apiMaxReplicas=1 \
            --query properties.outputs \
            --output json \
            --only-show-errors)"
          web_url="$(jq -r '.webAppUrl.value' <<< "$outputs")"
          test -n "$web_url" && test "$web_url" != null
          public_url="$web_url"
          if [[ -n "${{ steps.custom_domain.outputs.domain_name }}" ]]; then
            public_url="https://${{ steps.custom_domain.outputs.domain_name }}"
          fi
          echo "web_url=$web_url" >> "$GITHUB_OUTPUT"
          echo "public_url=$public_url" >> "$GITHUB_OUTPUT"

      - name: Verify live entry point and persisted route receipt
        id: smoke
        continue-on-error: true
        env:
          PUBLIC_URL: ${{ steps.release.outputs.public_url }}
          CUSTOM_DOMAIN_NAME: ${{ steps.custom_domain.outputs.domain_name }}
          CUSTOM_DOMAIN_CERTIFICATE_ID: ${{ steps.custom_domain.outputs.certificate_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$CUSTOM_DOMAIN_NAME" ]]; then
            bound_id="$(az containerapp show \
              --resource-group "$RESOURCE_GROUP" \
              --name "${NAME_PREFIX}-web-${ENVIRONMENT_NAME}" \
              --query "properties.configuration.ingress.customDomains[?name=='${CUSTOM_DOMAIN_NAME}'].certificateId | [0]" \
              --output tsv \
              --only-show-errors)"
            if [[ "$bound_id" != "$CUSTOM_DOMAIN_CERTIFICATE_ID" ]]; then
              echo "The custom-domain certificate binding was not preserved." >&2
              exit 1
            fi
          fi
          for path in /healthz /health/ready /api/v1/network /api/v1/scenarios; do
            ready=false
            for _ in {1..36}; do
              if curl --fail --silent --show-error --connect-timeout 5 --max-time 20 "${PUBLIC_URL}${path}" > /dev/null; then
                ready=true
                break
              fi
              sleep 5
            done
            [[ "$ready" == true ]]
          done
          pwsh -File scripts/check-local.ps1 -BaseUrl "$PUBLIC_URL"
          {
            echo "### RouteWise production deployment"
            echo ""
            echo "Deployed commit: \`${{ needs.images.outputs.deploy_sha }}\`"
            echo ""
            echo "Public URL: [${PUBLIC_URL}](${PUBLIC_URL})"
            echo ""
            echo "Azure origin: [${{ steps.release.outputs.web_url }}](${{ steps.release.outputs.web_url }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore previous images after a failed release check
        if: >-
          steps.smoke.outcome == 'failure' &&
          steps.previous.outputs.frontend_image != '' &&
          steps.previous.outputs.backend_image != ''
        env:
          PREVIOUS_FRONTEND_IMAGE: ${{ steps.previous.outputs.frontend_image }}
          PREVIOUS_BACKEND_IMAGE: ${{ steps.previous.outputs.backend_image }}
        shell: bash
        run: |
          set -euo pipefail
          az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "rollback-${GITHUB_RUN_ID}" \
            --template-file infra/azure/apps.bicep \
            --parameters \
              namePrefix="$NAME_PREFIX" \
              environmentName="$ENVIRONMENT_NAME" \
              containerAppsEnvironmentName="$CONTAINER_APPS_ENVIRONMENT" \
              frontendImage="$PREVIOUS_FRONTEND_IMAGE" \
              backendImage="$PREVIOUS_BACKEND_IMAGE" \
              databaseUrl="$DATABASE_URL" \
              browserCustomDomainName="$CUSTOM_DOMAIN" \
              webCustomDomainName="${{ steps.custom_domain.outputs.domain_name }}" \
              webCustomDomainCertificateId="${{ steps.custom_domain.outputs.certificate_id }}" \
              webMinReplicas=1 webMaxReplicas=1 \
              apiMinReplicas=1 apiMaxReplicas=1 \
            --only-show-errors \
            --output none

      - name: Fail after an unsuccessful release check
        if: steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          echo "The new release failed verification. Previous images were restored when available." >&2
          exit 1
