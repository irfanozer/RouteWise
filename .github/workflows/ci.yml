name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routewise-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: routewise
          POSTGRES_USER: routewise
          POSTGRES_PASSWORD: routewise-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routewise -d routewise"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ROUTEWISE_ENVIRONMENT: test
      ROUTEWISE_DATABASE_URL: postgresql+asyncpg://routewise:routewise-ci@localhost:5432/routewise
      ROUTEWISE_AUTO_CREATE_SCHEMA: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and quality tools
        run: python -m pip install --upgrade pip && python -m pip install --editable ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type-check
        run: mypy src

      - name: Verify migrations on PostgreSQL
        run: alembic upgrade head && alembic check

      - name: Run backend tests
        run: pytest

  frontend:
    name: Frontend quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build production frontend
        run: npm run build

  containers:
    name: Complete local stack
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build application images
        run: docker compose build backend frontend

      - name: Start PostgreSQL-backed stack
        run: docker compose up --detach --wait --wait-timeout 180

      - name: Verify public entry point and API
        shell: pwsh
        run: ./scripts/check-local.ps1

      - name: Show state and clean up
        if: always()
        run: |
          docker compose ps
          docker compose logs --no-color --tail 160
          docker compose down --volumes

  deployment-assets:
    name: Deployment assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate Azure templates
        shell: bash
        run: |
          set -euo pipefail
          for template in infra/azure/*.bicep; do
            az bicep build --file "$template" --stdout > /dev/null
          done

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref] $tokens,
              [ref] $parseErrors
            ) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
          }
