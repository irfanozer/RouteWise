name: AWS economy checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: routewise-aws-economy-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      COMPOSE_PROJECT_NAME: routewise-economy-ci
      BACKEND_IMAGE: routewise-backend:economy-ci
      POSTGRES_PASSWORD: "00000000000000000000000000000000"
      ORIGIN_DOMAIN: origin.example.com
      ORIGIN_VERIFY_TOKEN: "00000000000000000000000000000000"
      PUBLIC_ORIGIN: http://127.0.0.1:18080
      ROUTEWISE_SMOKE_URL: http://127.0.0.1:18080
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: |
          python -m pip install "PyYAML>=6,<7" "ruff>=0.9,<1"

      - name: Test economy safeguards without AWS access
        run: |
          python -m unittest discover -s tests/deployment -p 'test_aws_economy*.py' -v
          ruff check scripts/aws-economy tests/deployment/test_aws_economy*.py
          for script in scripts/aws-economy/*.sh; do bash -n "$script"; done

      - name: Start the isolated memory-limited application
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --project-directory infra/aws -f infra/aws-economy/compose.yaml -f tests/deployment/compose.economy-smoke.yaml)
          "${compose[@]}" config --quiet
          "${compose[@]}" build backend
          "${compose[@]}" up --detach --wait --wait-timeout 120 postgres
          "${compose[@]}" run --rm migrate
          "${compose[@]}" up --detach --wait --wait-timeout 180 backend api-proxy

      - name: Exercise persisted application behavior through the real proxy
        run: python tests/deployment/economy_route_smoke.py

      - name: Verify database export under economy limits
        shell: bash
        run: |
          set -euo pipefail
          compose=(docker compose --project-directory infra/aws -f infra/aws-economy/compose.yaml -f tests/deployment/compose.economy-smoke.yaml)
          "${compose[@]}" exec -T postgres pg_dump -U routewise -d routewise --format=custom --no-owner --no-acl > /tmp/economy-ci.dump
          test -s /tmp/economy-ci.dump
          "${compose[@]}" exec -T postgres pg_restore --list < /tmp/economy-ci.dump > /dev/null
          for service in postgres backend api-proxy; do
            container=$("${compose[@]}" ps -q "$service")
            test "$(docker inspect --format '{{.State.OOMKilled}}' "$container")" = false
            test "$(docker inspect --format '{{.RestartCount}}' "$container")" = 0
          done

      - name: Inspect and remove only the isolated CI runtime
        if: always()
        shell: bash
        run: |
          compose=(docker compose --project-directory infra/aws -f infra/aws-economy/compose.yaml -f tests/deployment/compose.economy-smoke.yaml)
          "${compose[@]}" ps
          "${compose[@]}" logs --no-color --tail 80 postgres backend api-proxy
          "${compose[@]}" down --volumes
