name: Deploy RouteWise to AWS economy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Shared with the preserved original workflow: never deploy both simultaneously.
concurrency:
  group: routewise-aws-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      vars.AWS_ECONOMY_DEPLOYMENT_ENABLED == 'true' &&
      vars.AWS_DEPLOYMENT_ENABLED != 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.id == github.repository_id))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: aws-production
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_STACK_NAME: ${{ vars.AWS_STACK_NAME || 'routewise-aws-prod' }}
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Require successful main push checks on the exact release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          deadline=$((SECONDS + 1800))
          for workflow in ci.yml aws-assets.yml aws-economy-checks.yml; do
            ready=false
            while (( SECONDS < deadline )); do
              runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$RELEASE_SHA&per_page=100")"
              if jq -e '[.workflow_runs[] | select(.head_branch == "main" and .event == "push" and .conclusion == "success")] | length > 0' <<< "$runs" > /dev/null; then
                ready=true
                break
              fi
              sleep 10
            done
            [[ "$ready" == true ]] || { echo "Required exact-commit checks have not succeeded: $workflow" >&2; exit 1; }
          done

      - name: Check out the verified release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: |
          python -m pip install "PyYAML>=6,<7"

      - name: Sign in using the existing project-scoped role
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5.1.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: routewise-economy-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Deploy the economy runtime with the preserved release safeguards
        id: release
        run: python scripts/aws-economy/deploy-from-ci.py

      - name: Verify the public custom domain and real application behavior
        shell: pwsh
        run: ./scripts/check-local.ps1 -BaseUrl https://routewise.irfanburakozer.com

      - name: Report verified release
        env:
          PREVIEW_URL: ${{ steps.release.outputs.preview_url }}
        run: |
          {
            echo "### RouteWise economy runtime"
            echo "Verified release: $RELEASE_SHA"
            echo "[Open deployment]($PREVIEW_URL)"
            echo "CloudFormation resize is a separate guarded operator action."
            echo "Original AWS and Azure deployment files are preserved."
          } >> "$GITHUB_STEP_SUMMARY"
